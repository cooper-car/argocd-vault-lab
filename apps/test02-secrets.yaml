apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test02-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/cooper-car/argocd-vault-lab
    path: manifests/test02
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: test02
  syncPolicy:
    automated:
      prune: true
      selfHeal: true